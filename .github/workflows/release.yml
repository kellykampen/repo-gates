name: Release

# Publishes @kellykampen/repo-gates to npm when a v* tag is pushed, via npm
# Trusted Publishing (OIDC) — no NPM_TOKEN secret. One-time setup on npmjs.com:
# configure a Trusted Publisher for this package pointing at
# kellykampen/repo-gates + workflow "release.yml" (allowed action: npm publish).
# Docs: https://docs.npmjs.com/trusted-publishers
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing (+ provenance)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm CLI >= 11.5.1; Node 22 ships npm 10.x.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # OIDC exchange happens automatically — no token. Provenance is attached.
      - name: Publish to npm (trusted publishing)
        run: npm publish --access public
